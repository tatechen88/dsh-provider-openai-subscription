# Safe install: the plugin is inserted in bootstrap state.
# Runtime is activated only after compatibility validation has passed.
#
# `meter` is the composition-level default layer for the built-in usage meter.
# Everything it accepts is also editable at runtime from the plugin's settings
# page (stored in $DSH_HOME/plugin-state/openai-subscription-meter.json), which
# is the layer that wins; this block only states the shape and the safe default.
- insert:
    - id: llm-openai-subscription
      name: dsh-provider-openai-subscription
      config:
        state: bootstrap
        oauth:
          clientId: ""
        provider:
          defaultModel: ""
          reasoningEffort: ""
        meter:
          # Account type is a user declaration, never a detection: the DeepSeek
          # public API does not report verification type. Values: unknown |
          # personal | enterprise.
          accountKind: unknown
          # Currency a cost is displayed in when the ledger has an amount in it.
          displayCurrency: CNY
          # 'system' | 'UTC' | 'Asia/Shanghai' — the zone "today" and "month" use.
          timeZone: system
          # Read the official DeepSeek balance. Turning it off makes no request.
          # Composition-level like every other field here: the settings page only
          # edits the display currency.
          deepseekBalance: true
          # Meter every provider DSH has registered, not only the vendors this
          # plugin reads accounts for: a model another plugin adds is counted from
          # its first call. Turning it off restores the fixed vendor registry.
          autoProviders: true
          # Read the vendor's own price page to price a model the built-in snapshot
          # does not carry. Off by default: it is the only outbound request the
          # meter makes that is not about the account's own state, and a table that
          # does not parse completely is rejected whole.
          refreshPublicPrices: false
          # Raw facts older than this many days fold into one rollup per day and
          # route at startup, so the ledger file stays bounded while every total
          # survives. Per-session detail keeps this window as its horizon.
          # 0 keeps every fact exactly as it happened.
          retentionDays: 90
          # Hide money / balance on shared screens; token counts stay visible.
          hideBalance: false
          hideCost: false
          # Enterprise price agreements. Each entry takes effect only for a
          # declared enterprise account, inside its validity window, for the
          # models it names. Rates are per 1,000,000 tokens in `currency`.
          #
          # contractualSchedules:
          #   - id: acme-2026
          #     label: Acme agreement
          #     currency: USD
          #     validFrom: "2026-01-01"
          #     validTo: "2026-12-31"
          #     models:
          #       deepseek-flash:
          #         cacheMiss: 0.1
          #         cacheHit: 0.001
          #         output: 0.2
          contractualSchedules: []
